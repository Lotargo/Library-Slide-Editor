[tool.poetry]
package-mode = false

[project]
name = "business-card-site"
version = "0.1.0"
description = "A Flask-based business card site with image export capabilities"
authors = [
    {name = "Jules"}
]
readme = "README.md"
requires-python = "^3.14"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "django (>=6.0,<7.0)",
    "pymongo (>=4.15.5,<5.0.0)",
    "dnspython (>=2.8.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
